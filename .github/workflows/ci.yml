name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      evidence_dir:
        description: "Directory with the collected reports and oracles (see docs/EVIDENCE.md)"
        required: false
        default: ""
        type: string
      evidence_runner:
        description: "Self-hosted runner label that can see evidence_dir"
        required: false
        default: "self-hosted"
        type: string
      integration_runner:
        description: "Runner label for the LLVM integration smoke (default: hosted, which reports SKIP without LLVM)"
        required: false
        default: "ubuntu-latest"
        type: string
      llvm_dir:
        description: "LLVM_DIR passed to the integration smoke (empty => SKIP: environment)"
        required: false
        default: ""
        type: string
      cxx:
        description: "CXX passed to the integration smoke"
        required: false
        default: ""
        type: string
      vcvars:
        description: "Windows vcvars64.bat passed to the integration smoke"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests (skip manifest enforced)
        run: python scripts/check_skips.py
      - name: Strict rules sweep
        run: python scripts/check_all_rules.py
      - name: Wheel install smoke
        run: python scripts/wheel_smoke.py
      - name: Strict rule check (ToyCPU)
        run: legispec --rules rules/toycpu.lspec check --strict
      - name: Construct coverage (committed LLVM header snapshot)
        run: legispec-constructs check
      - name: Closure (structure and pinned numbers only)
        run: legispec-closure check --skip-evidence

  release-hygiene:
    name: release hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tracked files, paths, and SPDX headers
        run: python scripts/check_release_hygiene.py

  codegen-contract:
    name: codegen contract (determinism + provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Generate twice and validate every rule/config
        run: python scripts/check_codegen_contract.py

  mutation-controls:
    name: mutation controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Negative controls must fail loudly
        run: python scripts/check_skips.py -p "test_mutation_controls.py"

  coverage-report:
    name: corpus coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Measure D/boundary/rules coverage
        run: python scripts/coverage_report.py --corpus examples --out out/coverage-report.json

  integration-smoke:
    name: integration smoke (LLVM build)
    runs-on: ${{ inputs.integration_runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      LLVM_DIR: ${{ inputs.llvm_dir }}
      CXX: ${{ inputs.cxx }}
      LEGISPEC_VCVARS: ${{ inputs.vcvars }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Build and run the generated ToyCPU consumer
        run: python scripts/integration_smoke.py --target toycpu --limit 2000 --out out/integration-report.json
      - name: Build and run the generated AArch64 vector consumer
        run: python scripts/integration_smoke.py --target aarch64-vector --limit 2000 --out out/integration-aarch64-report.json
      - name: Check integration status is honest
        if: always()
        run: python scripts/check_integration_status.py --require-pass-if-env LLVM_DIR out/integration-report.json out/integration-aarch64-report.json
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: integration-reports
          path: |
            out/integration-report.json
            out/integration-aarch64-report.json
          if-no-files-found: warn

  stage-evidence:
    name: stage evidence artifact (self-hosted runner with evidence_dir)
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_dir != ''
    runs-on: ${{ inputs.evidence_runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Validate evidence directory
        shell: bash
        env:
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        run: |
          if [ ! -d "$EVIDENCE_DIR" ]; then
            echo "::error file=docs/EVIDENCE.md::evidence_dir '$EVIDENCE_DIR' does not exist on this runner (see docs/EVIDENCE.md)."
            exit 1
          fi
          shopt -s nullglob dotglob
          entries=("$EVIDENCE_DIR"/*)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::error file=docs/EVIDENCE.md::evidence_dir '$EVIDENCE_DIR' is empty."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: legispec-evidence
          path: ${{ inputs.evidence_dir }}
          if-no-files-found: error

  evidence:
    name: evidence (collected reports and oracles)
    needs: stage-evidence
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_dir != ''
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: legispec-evidence
          path: evidence
      - name: Collect evidence
        run: python scripts/collect_evidence.py --from evidence
      - name: Claim ledger vs reports and oracles
        run: legispec-claims verify --verify-corpus
      - name: Full closure (claims audited)
        run: legispec-closure check
