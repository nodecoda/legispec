name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.0.0)"
        required: true
        type: string
      publish_pypi:
        description: "Publish the built distributions to PyPI"
        required: false
        default: false
        type: boolean
      evidence_dir:
        description: "Directory on a self-hosted runner containing the pinned reports and oracles"
        required: false
        default: ""
        type: string
      evidence_runner:
        description: "Runner label that can see evidence_dir"
        required: false
        default: "self-hosted"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Release hygiene
        run: python scripts/check_release_hygiene.py
      - name: Strict rules sweep
        run: python scripts/check_all_rules.py
      - name: Codegen contract
        run: python scripts/check_codegen_contract.py
      - name: Skip manifest
        run: python scripts/check_skips.py
      - name: Structural closure
        run: legispec-closure check --skip-evidence --write
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Wheel install smoke
        run: python scripts/wheel_smoke.py
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS
          cat ../SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* SHA256SUMS out/closure.json claims/claim-ledger.md --clobber
          else
            gh release create "$TAG" dist/* SHA256SUMS out/closure.json claims/claim-ledger.md --title "LegiSpec $TAG" --generate-notes
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: legispec-dist
          path: |
            dist/*
            SHA256SUMS

  evidence:
    name: full evidence gate (manual, self-hosted)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_dir != ''
    runs-on: ${{ inputs.evidence_runner || 'self-hosted' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Fetch evidence
        env:
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        shell: bash
        run: python scripts/collect_evidence.py --from "$EVIDENCE_DIR"
      - name: Claims and closure
        run: |
          legispec-claims verify --verify-corpus
          legispec-closure check --write
      - name: Attach full closure summary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" out/closure.json --clobber
      - name: Upload full closure summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: legispec-full-closure
          path: out/closure.json

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    if: vars.PYPI_PUBLISH == 'true' || inputs.publish_pypi == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/legispec
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: legispec-dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0  # release/v1.9
        with:
          packages-dir: dist
