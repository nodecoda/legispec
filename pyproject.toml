[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legalizer-dsl"
version = "0.2.0"
description = "External DSL, checker and C++ generator for LLVM GlobalISel LegalizerInfo rule tables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 WITH LLVM-exception" }
authors = [{ name = "Legalizer DSL contributors" }]
keywords = ["llvm", "globalisel", "legalizer", "tablegen", "compiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.scripts]
legalizer-dsl = "legalizer_dsl.cli:main"
ldsl-claims = "legalizer_dsl.claims:main"
ldsl-constructs = "legalizer_dsl.constructs:main"
ldsl-closure = "legalizer_dsl.closure:main"
ldsl-diff-oracles = "legalizer_dsl.diff_oracles:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/legalizer-dsl/rules" = ["rules/*.lspec"]
"share/legalizer-dsl/witness" = ["witness/*.witness"]
"share/legalizer-dsl/capabilities" = ["capabilities/*.json"]
"share/legalizer-dsl/claims" = ["claims/*.json", "claims/*.md", "claims/*.txt"]
"share/legalizer-dsl/docs" = ["docs/CLOSURE.md", "docs/COMPATIBILITY.md", "docs/CORRECTNESS.md", "docs/COVERAGE.md", "docs/EVIDENCE.md", "docs/INTEGRATION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
